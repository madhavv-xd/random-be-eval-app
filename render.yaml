# Render Blueprint for the API (Dashboard → New → Blueprint → pick this repo).
# Render supports WebSockets on web services, which Socket.io needs.
# The web app is deployed separately on Vercel (root directory: client).
services:
  - type: web
    name: pulse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
